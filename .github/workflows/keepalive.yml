name: keepalive
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping
        env:
          U: ${{ secrets.SB_URL }}
          K: ${{ secrets.SB_KEY }}
        run: |
          if [ -z "$U" ] || [ -z "$K" ]; then echo "secrets not set"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$U/rest/v1/rpc/username_taken" -H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: application/json" -d '{"name":"keepalive"}')
          echo "status $code"
          [ "$code" -lt 500 ]
