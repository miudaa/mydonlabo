<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>マイドンラボ</title>
<script>try{var t=localStorage.getItem("mydon-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
/* マイドン生成器（ムラサキ）の見た目に合わせたトークン */
:root{
  --bg:#f4f1ea; --panel:#ffffff; --ink:#23201c; --muted:#7a736a; --line:#e2ddd3;
  --accent:#f64828; --accent-ink:#ffffff; --gold:#d99a00;
  --check-a:rgba(127,127,127,.12); --tab-off:#ebe7de; --badge-bg:rgba(0,0,0,.6); --scrim:rgba(0,0,0,.55);
  --f-body:"Segoe UI","Yu Gothic UI","Meiryo","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1d21; --panel:#25272d; --ink:#ecebe8; --muted:#9a978f; --line:#363840; --gold:#f0b429; --tab-off:#202227; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1d21; --panel:#25272d; --ink:#ecebe8; --muted:#9a978f; --line:#363840; --gold:#f0b429; --tab-off:#202227; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--f-body)}
a{color:inherit}
.topbar{flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand b{white-space:nowrap;font-size:14px}
.brand small{display:block;color:var(--muted);font-size:11px}
.logo{width:32px;height:32px;display:block;flex:none}
.top-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:1 1 280px;min-width:0}
.sbox{position:relative;flex:1 1 auto;max-width:440px;min-width:0}
.bag-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-2px 0 8px;min-width:0}
.crumb{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.sub-btn{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--ink);cursor:pointer;font:inherit;font-size:12px}
.sub-btn small{color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}
.sub-btn:hover{border-color:var(--muted)}
.sub-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sub-btn[aria-pressed="true"] small{color:inherit;opacity:.8}
.sub-btn.more{color:var(--muted);border-style:dashed}
.sec{margin:16px 0 8px;font-size:13px;display:flex;align-items:baseline;gap:8px}
.sec:first-child{margin-top:0}
.sec small{color:var(--muted);font-weight:400}
.sec button{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;font-size:11px;cursor:pointer}
.sec button:hover{color:var(--accent)}
.sibs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 12px}
.sibs button{flex:none;width:56px;background:var(--bg);border:2px solid transparent;border-radius:8px;padding:2px;cursor:pointer;font:inherit;font-size:10px;color:var(--muted)}
.sibs button[aria-current="true"]{border-color:var(--accent);color:var(--ink)}
.sibs img{width:48px;height:48px;object-fit:contain;display:block;border-radius:5px;margin:0 auto 2px}
.sibs span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slabel{font-size:11px;color:var(--muted);margin-top:4px}
.brand-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.btn.icon{width:30px;height:30px;padding:0;display:grid;place-items:center;font-size:15px;line-height:1}
.btn{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%;padding:9px 10px;text-align:center}
.bag{min-width:0}
.tabs{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;scrollbar-width:none;padding-inline:10px;margin-bottom:-1px;position:relative;z-index:1}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--tab-off);border:1px solid var(--line);border-radius:8px 8px 0 0;padding:7px 14px;color:var(--muted);cursor:pointer;font:inherit;position:relative}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--panel);border-bottom-color:var(--panel);color:var(--ink);font-weight:600;padding-top:9px;box-shadow:inset 0 2px 0 var(--accent)}
.tab small{font-size:11px;margin-left:4px;opacity:.75;font-variant-numeric:tabular-nums}
main{max-width:1100px;margin:0 auto;padding-block:14px 32px;padding-inline:14px}
.bag-body{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.note{color:var(--muted);font-size:11px;margin:0 0 10px}
input,select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
.search{width:100%;min-width:0;display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.search:focus-within{border-color:var(--accent)}
.sicon{flex:none;margin-left:9px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none}
.search select{flex:none;border:0;border-left:1px solid var(--line);border-radius:0 6px 6px 0;background:none;color:var(--muted);padding-inline:8px 6px;cursor:pointer}
.search input:focus-visible{outline:none}
.advbtn{flex:none;font:inherit;border:0;border-left:1px solid var(--line);border-radius:0 6px 6px 0;background:none;color:var(--muted);padding:6px 10px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
.advbtn:hover,.advbtn[aria-expanded="true"]{color:var(--ink)}
.advbtn .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:10px;min-width:16px;height:16px;padding:0 4px;display:inline-grid;place-items:center}
.advbtn .car{font-size:10px;transition:transform .15s}
.advbtn[aria-expanded="true"] .car{transform:rotate(180deg)}
.adv{position:absolute;right:0;top:calc(100% + 6px);width:min(520px,calc(100vw - 28px));z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:10px;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.arow{display:grid;grid-template-columns:7em 1fr;gap:8px;align-items:center;min-width:0}
.arow.end{grid-template-columns:1fr;justify-items:end}
.alabel{font-size:12px;color:var(--muted)}
.drange{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.drange input{background:var(--bg);min-width:0}
.arow select{justify-self:start;min-width:10em;background:var(--bg)}
.seg{display:inline-flex;flex-wrap:wrap;justify-self:start;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;color:inherit;font:inherit;font-size:12px;padding:4px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.tchip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink);cursor:pointer;font:inherit;font-size:12px}
.tchip small{color:var(--muted);margin-left:4px}
.tchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tchip[aria-pressed="true"] small{color:inherit;opacity:.8}
.bmbtn{height:30px;padding:0 9px;display:flex;align-items:center;gap:4px;color:var(--muted)}
.bmbtn small{font-size:11px;font-variant-numeric:tabular-nums}
.bmbtn[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
@media (max-width:420px){.arow{grid-template-columns:1fr;gap:4px}}
.count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card:focus-visible,.tab:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thumb{aspect-ratio:1;max-width:100%;position:relative;border-radius:6px;overflow:hidden;background:repeating-conic-gradient(var(--check-a) 0% 25%,transparent 0% 50%) 50%/16px 16px}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;left:6px;bottom:6px;background:var(--badge-bg);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.meta{padding:6px 2px 2px;display:grid;gap:3px}
.meta h3{margin:0;font-size:13px;font-weight:600;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--ink)}
.bm{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:15px;cursor:pointer;line-height:1}
.bm[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}
#modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;max-width:560px;width:100%;max-height:92%;overflow:auto;padding:16px 18px;position:relative}
.x{position:absolute;top:4px;right:6px;border:0;background:none;font-size:24px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px}
.gal{position:relative;border-radius:8px;aspect-ratio:1;max-width:100%;overflow:hidden;margin-top:24px;background:repeating-conic-gradient(var(--check-a) 0% 25%,transparent 0% 50%) 50%/16px 16px}
.gal img{width:100%;height:100%;object-fit:contain;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:6px;border:0;background:var(--badge-bg);color:#fff;font-size:16px;cursor:pointer}
.nav.l{left:8px}.nav.r{right:8px}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 2px}
.thumbs button{flex:none;border:2px solid transparent;border-radius:8px;padding:2px;background:var(--bg);cursor:pointer}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:48px;height:48px;object-fit:contain;display:block;border-radius:5px}
.detail h2{margin:10px 0 4px;font-size:16px;text-wrap:balance}
.dmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:8px}
.desc{white-space:pre-wrap;margin:0 0 12px;max-width:65ch}
.dl{display:grid;gap:6px;margin-bottom:10px}
.frow{display:flex;gap:6px;align-items:stretch;min-width:0}
.file{flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;text-decoration:none;min-width:0}
.file:hover{border-color:var(--muted)}
.file span{min-width:0;word-break:break-all}
.file small{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.copy{flex:none;font:inherit;font-size:12px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0;width:4.6em;cursor:pointer;white-space:nowrap;text-align:center}
.copy:hover{border-color:var(--muted)}
.copy.done{color:var(--accent);border-color:var(--accent)}
.btn[data-dbm][aria-pressed="true"]{background:var(--bg);color:var(--gold);border-color:var(--gold)}
.src{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--badge-bg);color:#fff;font-size:12px;padding:6px 12px;border-radius:6px;z-index:60;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:760px){.brand small{display:none}}
@media (min-width:860px){
  .mbox{max-width:920px;padding:20px 22px}
  .detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
  .dmedia{position:sticky;top:0}
  .dinfo{padding-top:24px;min-width:0}
  .dinfo h2{margin-top:0;font-size:18px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand-wrap"><a class="brand" href="#"><img class="logo" src="logo64.png" alt=""><b>マイドンラボ</b></a><button class="btn icon" id="themeBtn" type="button"></button><button class="btn bmbtn" id="bmBtn" type="button" aria-pressed="false" title="ブクマだけ表示">★<small id="bmCount">0</small></button></div>
  <div class="top-actions">
  <div class="sbox"><div class="search"><svg class="sicon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="タイトル・説明で検索" aria-label="検索"><button class="advbtn" id="advBtn" type="button" aria-expanded="false" aria-controls="adv">詳細検索<span class="n" id="advN" hidden></span><span class="car">▾</span></button></div>
<div class="adv" id="adv" hidden>
    <div class="arow"><span class="alabel">検索</span><div class="seg" id="modeSeg"><button type="button" data-mode="all">全体検索</button><button type="button" data-mode="kw">キーワード検索</button><button type="button" data-mode="tag">タグ指定</button></div></div>
    <div class="arow" id="tagRow" hidden><span class="alabel">タグ</span><div class="chips" id="tagChips"></div></div>
    <div class="arow"><span class="alabel">ソート順</span><select id="sort" aria-label="ソート順"><option value="new">新しい順</option><option value="old">古い順</option><option value="name">名前（昇順）</option><option value="name-desc">名前（降順）</option></select></div>
    <div class="arow"><span class="alabel">fps</span><select id="fps" aria-label="fps"></select></div>
    <div class="arow"><span class="alabel">日付</span><div class="drange"><input type="date" id="dFrom" aria-label="この日から"><span>〜</span><input type="date" id="dTo" aria-label="この日まで"></div></div>
    <div class="arow"><span class="alabel">シミュレーター</span><select id="sim" aria-label="シミュレーター"></select></div>
    <div class="arow"><span class="alabel">カラー</span><div class="seg" id="colorSeg"><button type="button" data-color="">すべて</button><button type="button" data-color="default">default</button><button type="button" data-color="other">その他</button></div></div>
    <div class="arow end"><button class="btn" id="advReset" type="button">条件をリセット</button></div>
  </div>
  </div>
  <a class="btn" id="postLink" hidden href="https://github.com" target="_blank" rel="noopener" title="管理者用：GitHub でリリースを作成">＋ 投稿</a></div>
</header>
<main>
  <p class="note" id="demoNote" hidden>プレビュー：サンプルデータを表示しています。公開版では GitHub のリリースがここに並びます。</p>
  <section class="bag">
  <nav class="tabs" id="tabs" aria-label="カテゴリ"></nav>
  <div class="bag-body">
  <div class="subs" id="subs" hidden></div>
  <div class="bag-head"><span class="crumb" id="crumb"></span><span class="count" id="count"></span></div>
  <div id="list"><p class="empty">読み込み中…</p></div>
  </div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><button class="x" id="mclose" aria-label="閉じる">×</button><div id="mbody"></div></div></div>

<script>
// ===== 設定：GitHub のユーザー名とリポジトリ名 =====
const GITHUB_OWNER = 'miudaa';
const GITHUB_REPO  = 'mydonlabo';
const CATEGORY_ORDER = [];          // タブの並び順（空なら登場順）例: ['段位','イベント','季節']
// ====================================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = n => n >= 1073741824 ? (n/1073741824).toFixed(2)+' GB' : n >= 1048576 ? (n/1048576).toFixed(1)+' MB' : n >= 1024 ? Math.round(n/1024)+' KB' : n+' B';
const fmtDate = s => { const d = new Date(s); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };
const IMG_RE = /\.(png|jpe?g|gif|webp|avif)$/i;
const DEMO = !GITHUB_OWNER || !GITHUB_REPO;

const S = { posts: [], items: [], cats: [], cat: 'all', sub: 'all', subsOpen: false, q: '', sort: 'new', bms: new Set(), bmOnly: false, mode: 'all', tags: new Set(), fps: '', color: '', sim: '', dFrom: '', dTo: '' };
const SIM_LIST = ['taikonauts', 'TJAPlayer3', 'OpenTaiko'];
const SIM_DEFAULT = 'taikonauts';
const FPS_LIST = ['240', '120', '60', '30', '20', '15', '10'];
const SUB_LIMIT = 8;   // 小分類ボタンをこの数より多く出す時は「＋N」でたたむ
const natural = (a, b) => a.localeCompare(b, 'ja', { numeric: true, sensitivity: 'base' });

// ----- ブクマ（このブラウザに保存・マイドン1体ずつ） -----
const BM_KEY = 'mydon-bookmarks';
try { S.bms = new Set(JSON.parse(localStorage.getItem(BM_KEY) || '[]')); } catch {}
function saveBms(){ try { localStorage.setItem(BM_KEY, JSON.stringify([...S.bms])); } catch {} }

// ----- リリース本文の「カテゴリ: / タグ: / fps: / カラー: / シミュレーター:」を読む -----
const META = { sim: /^(?:シミュレーター|シミュレータ|simulator|sim)$/i, cat: /^(?:カテゴリ|category)$/i, tags: /^(?:タグ|tags?)$/i, fps: /^fps$/i, color: /^(?:カラー|色|colou?r)$/i };
function parseBody(body){
  const meta = { cat: null, tags: [], fps: null, color: null, sim: null }; const rest = [];
  for (const line of String(body || '').split(/\r?\n/)) {
    const m = line.match(/^\s*([^:：;；\s]+)\s*[:：;；]\s*(.*?)\s*$/);
    const key = m && Object.keys(META).find(k => META[k].test(m[1]));
    if (!key) { rest.push(line); continue; }
    const v = m[2];
    if (key === 'tags') meta.tags.push(...v.split(/[,、，\s]+/).filter(Boolean));
    else if (v && meta[key] == null) meta[key] = key === 'fps' ? ((v.match(/\d+/) || [null])[0]) : v;
  }
  meta.tags = [...new Set(meta.tags)];
  if (!meta.sim) meta.sim = SIM_DEFAULT;
  return { ...meta, desc: rest.join('\n').trim() };
}
const localDay = s => { const d = new Date(s), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
const isDefaultColor = p => !p.color || /^(?:default|デフォルト|標準)$/i.test(p.color);
const stem = n => n.replace(/\.[^.]+$/, '');
const isImgAsset = a => (a.type || '').startsWith('image/') || IMG_RE.test(a.name);

// 1つのリリース（小分類）の添付を、同じ名前の「画像＋zip」ごとにマイドン1体ずつへ分ける
function buildItems(post, assets){
  const imgs = assets.filter(isImgAsset), others = assets.filter(a => !isImgAsset(a));
  const groups = new Map();
  for (const f of others) { const k = stem(f.name).toLowerCase(); if (!groups.has(k)) groups.set(k, { name: stem(f.name), images: [], files: [] }); groups.get(k).files.push(f); }
  const loose = [];
  for (const im of imgs) {
    const k = stem(im.name).toLowerCase(), base = k.replace(/[_\-\s]\d+$/, '');
    const g = groups.get(k) || groups.get(base);
    g ? g.images.push(im) : loose.push(im);
  }
  let list = [...groups.values()];
  if (!list.some(g => g.images.length)) list = [{ name: post.title, images: imgs, files: others }];   // 名前がそろっていない時は、リリース全体で1体
  else { list.sort((x, y) => natural(x.name, y.name)); list.forEach(g => { if (!g.images.length) g.images = loose; }); }
  return list.map(g => {
    const fpsInName = g.files.map(f => (f.name.match(/(\d+)\s*fps/i) || [])[1]).find(Boolean);
    const shown = g.name.replace(/[_\-\s]*\d+\s*fps$/i, '') || g.name;
    return { ...post, id: post.rid + ':' + g.name, name: shown, images: g.images.map(x => x.url), files: g.files, fps: fpsInName || post.fps };
  });
}

function fromRelease(r){
  const meta = parseBody(r.body);
  const post = { rid: String(r.id), rtitle: r.name || r.tag_name, title: r.name || r.tag_name, ...meta, date: r.published_at || r.created_at, page: r.html_url };
  post.items = buildItems(post, (r.assets || []).map(a => ({ name: a.name, size: a.size, url: a.browser_download_url, type: a.content_type })));
  return post;
}

async function loadReleases(){
  const all = [];
  for (let page = 1; page <= 10; page++) {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases?per_page=100&page=${page}`, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
    if (!res.ok) throw new Error(res.status === 403 ? '少し時間をおいて再読み込みして下さい（GitHub の取得回数の上限）' : `GitHub から取得できませんでした（${res.status}）`);
    const list = await res.json();
    all.push(...list.filter(r => !r.draft));
    if (list.length < 100) break;
  }
  return all.map(fromRelease);
}

function sampleImg(hue, label, k){
  const c = document.createElement('canvas'); c.width = c.height = 480;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 480, 480);
  grd.addColorStop(0, `hsl(${hue} 70% 82%)`); grd.addColorStop(1, `hsl(${(hue + 40) % 360} 65% 66%)`);
  g.fillStyle = grd; g.fillRect(0, 0, 480, 480);
  g.fillStyle = `hsl(${hue} 60% 40% / .18)`;
  for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(60 + ((i * 97 + k * 53) % 380), 70 + ((i * 131 + k * 29) % 360), 30 + (i % 3) * 18, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,.92)'; g.beginPath(); g.roundRect(70, 180, 340, 120, 24); g.fill();
  g.fillStyle = `hsl(${hue} 55% 28%)`; g.textAlign = 'center';
  g.font = '700 34px "Noto Sans JP", "Noto Sans CJK JP", sans-serif'; g.fillText(label, 240, 240);
  g.font = '500 22px "Noto Sans JP", "Noto Sans CJK JP", sans-serif'; g.fillText(`サンプル画像 ${k + 1}`, 240, 278);
  return c.toDataURL('image/png');
}

function buildCats(){
  const seen = [];
  for (const p of S.posts) if (p.cat && !seen.includes(p.cat)) seen.push(p.cat);
  const ordered = CATEGORY_ORDER.filter(c => seen.includes(c));
  S.cats = [...ordered, ...seen.filter(c => !ordered.includes(c))];
  S.items = S.posts.flatMap(p => p.items);
}
const inCat = (x, c) => c === 'all' ? true : c === 'none' ? !x.cat : x.cat === c;
const isSearching = () => !!S.q.trim() || S.bmOnly;
function postsInCat(){
  return S.posts.filter(p => inCat(p, S.cat)).sort((a, b) => S.sort === 'old' ? a.date.localeCompare(b.date) : S.sort.startsWith('name') ? natural(a.rtitle, b.rtitle) * (S.sort === 'name-desc' ? -1 : 1) : b.date.localeCompare(a.date));
}

function renderTabs(){
  const n = c => S.items.filter(x => inCat(x, c)).length;

    `<button class="tab" data-cat="${esc(id)}" aria-pressed="${S.cat === id && !isSearching()}">${esc(name)}<small>${n(id)}</small></button>`).join('');
}

function haystack(x){
  if (S.mode === 'kw') return [x.name, x.rtitle, x.desc].join(' ');
  if (S.mode === 'tag') return x.tags.join(' ');
  return [x.name, x.rtitle, x.desc, x.cat, ...x.tags, ...x.files.map(f => f.name), x.fps ? x.fps + 'fps' : '', x.color, x.sim].join(' ');
}
function passes(x){
  if (S.bmOnly && !S.bms.has(x.id)) return false;
  if (S.fps && x.fps !== S.fps) return false;
  if (S.sim && x.sim.toLowerCase() !== S.sim.toLowerCase()) return false;
  if (S.dFrom && localDay(x.date) < S.dFrom) return false;
  if (S.dTo && localDay(x.date) > S.dTo) return false;
  if (S.color === 'default' && !isDefaultColor(x)) return false;
  if (S.color === 'other' && isDefaultColor(x)) return false;
  if (S.mode === 'tag' && S.tags.size && ![...S.tags].every(t => x.tags.includes(t))) return false;
  const words = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (words.length) { const h = haystack(x).toLowerCase(); if (!words.every(w => h.includes(w))) return false; }
  return true;
}
function sortItems(list){
  const s = [...list];
  if (S.sort === 'new') s.sort((a, b) => b.date.localeCompare(a.date) || natural(a.name, b.name));
  if (S.sort === 'old') s.sort((a, b) => a.date.localeCompare(b.date) || natural(a.name, b.name));
  if (S.sort === 'name') s.sort((a, b) => natural(a.name, b.name));
  if (S.sort === 'name-desc') s.sort((a, b) => natural(b.name, a.name));
  return s;
}

  $('#advN').hidden = !n; $('#advN').textContent = n;
  $('#bmBtn').setAttribute('aria-pressed', S.bmOnly); $('#bmCount').textContent = S.items.filter(x => S.bms.has(x.id)).length;

function card(x, showGroup){
  return `<div class="card" role="button" tabindex="0" data-id="${esc(x.id)}">
      <div class="thumb">${x.images[0] ? `<img loading="lazy" src="${esc(x.images[0])}" alt="">` : ''}

function renderGrid(){
  const list = $('#list');
  const empty = msg => `<p class="empty">${msg}</p>`;
  let html = '', count = 0, crumb = '';
  if (isSearching()) {
    const items = sortItems(S.items.filter(passes)); count = items.length;
    crumb = S.bmOnly ? '★ ブクマ' : '検索結果（すべての分類）';
    html = items.length ? `<div class="grid">${items.map(x => card(x, true)).join('')}</div>`
      : empty(S.bmOnly && !S.items.some(x => S.bms.has(x.id)) ? 'まだブクマがありません。気になるマイドンの ★ を押すとここに集まります。' : '該当するマイドンがありません');
  } else if (S.cat === 'all') {
    const items = sortItems(S.items.filter(passes)); count = items.length; crumb = 'すべてのマイドン';
    html = items.length ? `<div class="grid">${items.map(x => card(x, true)).join('')}</div>` : empty(S.items.length ? '該当するマイドンがありません' : 'まだ投稿がありません');
  } else {
    const posts = postsInCat();
    const catName = S.cat === 'none' ? 'その他' : S.cat;
    const one = posts.length === 1 ? posts[0] : posts.find(p => p.rid === S.sub);
    if (one) {
      const items = sortItems(one.items.filter(passes)); count = items.length;
      crumb = `${catName} › ${one.rtitle}`;
      html = items.length ? `<div class="grid">${items.map(x => card(x, false)).join('')}</div>` : empty('該当するマイドンがありません');
    } else {
      crumb = catName;
      html = posts.map(p => {
        const items = sortItems(p.items.filter(passes)); count += items.length;
        return items.length ? `<h4 class="sec">${esc(p.rtitle)}<small>${items.length}体</small><button type="button" data-open="${esc(p.rid)}">これだけ見る ›</button></h4><div class="grid">${items.map(x => card(x, false)).join('')}</div>` : '';
      }).join('') || empty('該当するマイドンがありません');
    }
  }
  $('#crumb').textContent = crumb;
  $('#count').textContent = count + '体';
  list.innerHTML = html;
}

async function copyText(text){

  const label = '表示モード：' + THEMES.find(t => t[0] === theme)[1];
  const tb = $('#themeBtn'); tb.textContent = theme === 'dark' ? '☾' : theme === 'light' ? '☀' : '◐'; tb.title = label; tb.setAttribute('aria-label', label + '（押すと切り替え）');
  try { theme === 'auto' ? localStorage.removeItem('mydon-theme') : localStorage.setItem('mydon-theme', theme); } catch {}
}
$('#themeBtn').addEventListener('click', () => { const i = THEMES.findIndex(t => t[0] === theme); theme = THEMES[(i + 1) % THEMES.length][0]; applyTheme(); });
applyTheme();
const syncAdmin = () => { $('#postLink').hidden = location.hash !== '#admin'; };
window.addEventListener('hashchange', syncAdmin);
syncAdmin();
document.querySelector('.brand').addEventListener('click', e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
$('#mbody').addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  if (await copyText(b.dataset.copy)) {
    b.textContent = '✓ 完了'; b.classList.add('done'); toast('URLをコピーしました');
    setTimeout(() => { b.textContent = 'コピー'; b.classList.remove('done'); }, 1600);
  } else toast('コピーできませんでした。リンクを長押ししてコピーして下さい');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

// ----- 起動 -----
(async () => {
  if (DEMO) {
    $('#demoNote').hidden = false;
    if (document.fonts) { try { await document.fonts.ready; } catch {} }
    S.posts = demoPosts();
  } else {
    const postUrl = () => {
      const d = new Date(), z = n => String(n).padStart(2, '0');
      const tag = `post-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
      const q = new URLSearchParams({ tag, body: 'カテゴリ: \nタグ: \nfps: 60\nカラー: default\nシミュレーター: taikonauts\n' });
      return `https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/releases/new?${q}`;
    };
    const link = $('#postLink');
    link.href = postUrl();
    ['pointerdown', 'focus'].forEach(ev => link.addEventListener(ev, () => { link.href = postUrl(); }));
    try { S.posts = await loadReleases(); }
    catch (err) { $('#list').innerHTML = `<p class="empty">${esc(err.message)}</p>`; return; }
  }
  buildCats(); render();
})();
</script>
</body>
</html>
