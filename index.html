<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>マイドン置き場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: シンプルなヘッダー → カテゴリのチップ → 画像主体のカードグリッド */
:root{
  --bg:#f5f6f8; --paper:#ffffff; --ink:#191c22; --muted:#6a7180; --line:#e3e6eb;
  --accent:#e2462f; --accent-ink:#ffffff; --tint:#fdeeeb; --gold:#d99a00;
  --badge-bg:rgba(20,24,32,.62); --bm-bg:rgba(255,255,255,.92); --scrim:rgba(12,14,20,.6);
  --f-body:'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121418; --paper:#1b1e24; --ink:#e9ebef; --muted:#9aa1ae; --line:#2b2f37;
  --accent:#f0624b; --accent-ink:#ffffff; --tint:#3a201c; --gold:#f0b429;
  --badge-bg:rgba(0,0,0,.6); --bm-bg:rgba(27,30,36,.92); --scrim:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121418; --paper:#1b1e24; --ink:#e9ebef; --muted:#9aa1ae; --line:#2b2f37;
  --accent:#f0624b; --accent-ink:#ffffff; --tint:#3a201c; --gold:#f0b429;
  --badge-bg:rgba(0,0,0,.6); --bm-bg:rgba(27,30,36,.92); --scrim:rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.6;margin:0}
a{color:inherit}
header{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.hd{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{font-size:1.15rem;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--tint)}
.post{margin-left:auto;flex:none;white-space:nowrap;font-size:.85rem;font-weight:500;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--muted)}
.post:hover,.post:focus-visible{color:var(--ink);border-color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding-block:16px 40px;padding-inline:16px}
.demo{font-size:.8rem;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:0 0 14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:inherit;font-size:.9rem;font-weight:500;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.tab:hover{border-color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab small{font-size:.75rem;opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center;margin:0 0 16px;flex-wrap:wrap}
input,select{font:inherit;font-size:.9rem;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#q{flex:1 1 200px;min-width:0}
.count{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.card:focus-visible,.tab:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thumb{aspect-ratio:1;max-width:100%;background:var(--line);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:8px;bottom:8px;background:var(--badge-bg);color:#fff;font-size:.72rem;padding:2px 8px;border-radius:999px}
.meta{padding:10px 12px 12px;display:grid;gap:6px}
.meta h3{margin:0;font-size:.92rem;font-weight:700;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:flex;gap:6px;align-items:center;font-size:.74rem;color:var(--muted);flex-wrap:wrap}
.chip{background:var(--tint);color:var(--accent);border-radius:999px;padding:0 8px;font-weight:500}
.bm{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--bm-bg);color:var(--muted);font-size:1.05rem;cursor:pointer;line-height:1}
.bm[aria-pressed="true"]{color:var(--gold)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}
#modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{background:var(--paper);border-radius:18px;max-width:620px;width:100%;max-height:92%;overflow:auto;padding:18px;position:relative}
.x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:1.8rem;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px}
.gal{position:relative;background:var(--bg);border-radius:12px;aspect-ratio:1;max-width:100%;overflow:hidden;margin-top:26px}
.gal img{width:100%;height:100%;object-fit:contain;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:var(--badge-bg);color:#fff;font-size:1.2rem;cursor:pointer}
.nav.l{left:8px}.nav.r{right:8px}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 4px}
.thumbs button{flex:none;border:2px solid transparent;border-radius:8px;padding:0;background:none;cursor:pointer;overflow:hidden}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:54px;height:54px;object-fit:cover;display:block}
.detail h2{margin:12px 0 6px;font-size:1.2rem;text-wrap:balance}
.dmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:8px}
.desc{white-space:pre-wrap;margin:0 0 14px;max-width:65ch}
.dl{display:grid;gap:6px;margin-bottom:12px}
.file{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;min-width:0}
.file:hover{border-color:var(--accent)}
.file span{min-width:0;word-break:break-all}
.file small{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.btn{width:100%;border:0;border-radius:999px;padding:12px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"]{background:var(--paper);color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.src{display:block;text-align:center;font-size:.8rem;color:var(--muted);margin-top:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<header>
  <div class="hd">
    <a class="logo" href="#"><i></i>マイドン置き場</a>
    <a class="post" id="postLink" href="https://github.com" target="_blank" rel="noopener" title="管理者用：GitHub でリリースを作成">＋ 投稿</a>
  </div>
</header>
<main>
  <p class="demo" id="demoNote" hidden>プレビュー：サンプルデータを表示しています。公開版では GitHub のリリースがここに並びます。</p>
  <nav class="tabs" id="tabs" aria-label="カテゴリ"></nav>
  <div class="tools">
    <input id="q" type="search" placeholder="タイトル・説明で検索" aria-label="検索">
    <select id="sort" aria-label="並び順"><option value="new">新しい順</option><option value="old">古い順</option><option value="name">名前順</option></select>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"><p class="empty">読み込み中…</p></div>
</main>
<div id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><button class="x" id="mclose" aria-label="閉じる">×</button><div id="mbody"></div></div></div>

<script>
// ===== 設定：GitHub のユーザー名とリポジトリ名 =====
const GITHUB_OWNER = 'miudaa';
const GITHUB_REPO  = 'mydonlabo';
const CATEGORY_ORDER = [];          // タブの並び順（空なら登場順）例: ['段位','イベント','季節']
// ====================================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = n => n >= 1073741824 ? (n/1073741824).toFixed(2)+' GB' : n >= 1048576 ? (n/1048576).toFixed(1)+' MB' : n >= 1024 ? Math.round(n/1024)+' KB' : n+' B';
const fmtDate = s => { const d = new Date(s); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };
const IMG_RE = /\.(png|jpe?g|gif|webp|avif)$/i;
const DEMO = !GITHUB_OWNER || !GITHUB_REPO;

const S = { posts: [], cats: [], cat: 'all', q: '', sort: 'new', bms: new Set() };

// ----- ブクマ（このブラウザに保存） -----
const BM_KEY = 'mydon-bookmarks';
try { S.bms = new Set(JSON.parse(localStorage.getItem(BM_KEY) || '[]')); } catch {}
function saveBms(){ try { localStorage.setItem(BM_KEY, JSON.stringify([...S.bms])); } catch {} }

// ----- リリース本文から「カテゴリ: ○○」を取り出す -----
function parseBody(body){
  let cat = null; const rest = [];
  for (const line of String(body || '').split(/\r?\n/)) {
    const m = line.match(/^\s*(?:カテゴリ|category)\s*[:：]\s*(.+?)\s*$/i);
    if (m && !cat) cat = m[1]; else rest.push(line);
  }
  return { cat, desc: rest.join('\n').trim() };
}

function fromRelease(r){
  const { cat, desc } = parseBody(r.body);
  const assets = r.assets || [];
  const isImg = a => (a.content_type || '').startsWith('image/') || IMG_RE.test(a.name);
  return {
    id: String(r.id), title: r.name || r.tag_name, cat, desc,
    date: r.published_at || r.created_at, page: r.html_url,
    images: assets.filter(isImg).map(a => a.browser_download_url),
    files: assets.filter(a => !isImg(a)).map(a => ({ name: a.name, size: a.size, url: a.browser_download_url }))
  };
}

async function loadReleases(){
  const key = `mydon-cache-${GITHUB_OWNER}/${GITHUB_REPO}`;
  try { const c = JSON.parse(sessionStorage.getItem(key) || 'null'); if (c && Date.now() - c.t < 600000) return c.d; } catch {}
  const all = [];
  for (let page = 1; page <= 10; page++) {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases?per_page=100&page=${page}`, { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok) throw new Error(res.status === 403 ? '少し時間をおいて再読み込みして下さい（GitHub の取得回数の上限）' : `GitHub から取得できませんでした（${res.status}）`);
    const list = await res.json();
    all.push(...list.filter(r => !r.draft));
    if (list.length < 100) break;
  }
  const d = all.map(fromRelease);
  try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), d })); } catch {}
  return d;
}

// ----- プレビュー用のサンプル（本物のマイドン画像ではありません） -----
function sampleImg(hue, label, k){
  const c = document.createElement('canvas'); c.width = c.height = 480;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 480, 480);
  grd.addColorStop(0, `hsl(${hue} 70% 82%)`); grd.addColorStop(1, `hsl(${(hue + 40) % 360} 65% 66%)`);
  g.fillStyle = grd; g.fillRect(0, 0, 480, 480);
  g.fillStyle = `hsl(${hue} 60% 40% / .18)`;
  for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(60 + ((i * 97 + k * 53) % 380), 70 + ((i * 131 + k * 29) % 360), 30 + (i % 3) * 18, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,.92)'; g.beginPath(); g.roundRect(70, 180, 340, 120, 24); g.fill();
  g.fillStyle = `hsl(${hue} 55% 28%)`; g.textAlign = 'center';
  g.font = '700 34px "Noto Sans JP", "Noto Sans CJK JP", sans-serif'; g.fillText(label, 240, 240);
  g.font = '500 22px "Noto Sans JP", "Noto Sans CJK JP", sans-serif'; g.fillText(`サンプル画像 ${k + 1}`, 240, 278);
  return c.toDataURL('image/png');
}
function demoPosts(){
  const day = 86400000, now = Date.now();
  const rows = [
    ['はっぴ姿の夏祭りセット', 'イベント', 20, 3, '夏祭りイベント用に作ったコーデです。\nはっぴ・うちわ・下駄の3点セット。', [['matsuri_set.zip', 18400000]], 1],
    ['ゆる部屋着コーデ', '普段着', 200, 2, 'のんびり部屋着。色違いを2つ入れています。', [['heyagi_blue.zip', 9200000], ['heyagi_pink.zip', 9400000]], 3],
    ['段位道場 八段記念', '段位', 0, 4, '八段合格記念のフルセットです。高画質版なので容量大きめです。', [['8dan_full_hq.zip', 1240000000]], 5],
    ['和楽器バンド風', 'イベント', 280, 1, '', [['wagakki.zip', 32000000]], 8],
    ['雪だるまの冬支度', '季節', 190, 2, 'マフラーと手袋つき。', [['winter.zip', 21000000]], 12],
    ['お団子屋さん', 'イベント', 330, 3, '三色団子モチーフ。看板の小物も入っています。', [['dango_shop.zip', 45000000], ['dango_extra_parts.zip', 6100000]], 20],
    ['宇宙飛行士', '普段着', 230, 1, '', [['astronaut.zip', 15500000]], 31]
  ];
  return rows.map(([title, cat, hue, n, desc, files, ago], i) => ({
    id: 'demo' + i, title, cat, desc, date: new Date(now - ago * day).toISOString(), page: 'https://github.com',
    images: Array.from({ length: n }, (_, k) => sampleImg(hue, title.slice(0, 8), k)),
    files: files.map(([name, size]) => ({ name, size, url: 'https://github.com' }))
  }));
}

// ----- 表示 -----
function buildCats(){
  const seen = [];
  for (const p of S.posts) if (p.cat && !seen.includes(p.cat)) seen.push(p.cat);
  const ordered = CATEGORY_ORDER.filter(c => seen.includes(c));
  S.cats = [...ordered, ...seen.filter(c => !ordered.includes(c))];
}

function renderTabs(){
  const n = c => c === 'all' ? S.posts.length : c === 'bm' ? S.posts.filter(p => S.bms.has(p.id)).length : c === 'none' ? S.posts.filter(p => !p.cat).length : S.posts.filter(p => p.cat === c).length;
  const tabs = [['all', 'すべて'], ...S.cats.map(c => [c, c])];
  if (S.posts.some(p => !p.cat)) tabs.push(['none', 'その他']);
  tabs.push(['bm', '★ ブクマ']);
  $('#tabs').innerHTML = tabs.map(([id, name]) =>
    `<button class="tab" data-cat="${esc(id)}" aria-pressed="${S.cat === id}">${esc(name)}<small>${n(id)}</small></button>`).join('');
}

function visible(){
  let list = S.posts;
  if (S.cat === 'bm') list = list.filter(p => S.bms.has(p.id));
  else if (S.cat === 'none') list = list.filter(p => !p.cat);
  else if (S.cat !== 'all') list = list.filter(p => p.cat === S.cat);
  const q = S.q.trim().toLowerCase();
  if (q) list = list.filter(p => (p.title + ' ' + p.desc).toLowerCase().includes(q));
  const sorted = [...list];
  if (S.sort === 'new') sorted.sort((a, b) => b.date.localeCompare(a.date));
  if (S.sort === 'old') sorted.sort((a, b) => a.date.localeCompare(b.date));
  if (S.sort === 'name') sorted.sort((a, b) => a.title.localeCompare(b.title, 'ja'));
  return sorted;
}

function renderGrid(){
  const list = visible();
  $('#count').textContent = list.length + '件';
  $('#grid').innerHTML = list.map(p => `
    <div class="card" role="button" tabindex="0" data-id="${esc(p.id)}">
      <div class="thumb">${p.images[0] ? `<img loading="lazy" src="${esc(p.images[0])}" alt="">` : ''}
        ${p.images.length > 1 ? `<span class="badge">${p.images.length}枚</span>` : ''}</div>
      <div class="meta"><h3>${esc(p.title)}</h3>
        <div class="sub">${p.cat ? `<span class="chip">${esc(p.cat)}</span>` : ''}<span>zip ×${p.files.length}</span><span>${fmtDate(p.date)}</span></div></div>
      <button class="bm" data-bm="${esc(p.id)}" aria-pressed="${S.bms.has(p.id)}" aria-label="ブクマ">★</button>
    </div>`).join('') || `<p class="empty">${!S.posts.length ? 'まだ投稿がありません' : S.cat === 'bm' ? 'まだブクマがありません。気になるマイドンの ★ を押すとここに集まります。' : '該当するマイドンがありません'}</p>`;
}

function render(){ renderTabs(); renderGrid(); }

function toggleBm(id){
  S.bms.has(id) ? S.bms.delete(id) : S.bms.add(id);
  saveBms(); render();
  const b = document.querySelector('#mbody [data-dbm]');
  if (b && b.dataset.dbm === id) setDbm(b, id);
}
function setDbm(b, id){ const on = S.bms.has(id); b.setAttribute('aria-pressed', on); b.textContent = on ? '★ ブクマ済み' : '☆ ブクマする'; }

function openDetail(id){
  const p = S.posts.find(x => x.id === id); if (!p) return;
  let i = 0;
  $('#mbody').innerHTML = `<div class="detail">
    <div class="gal">${p.images.length ? `<img id="gimg" src="${esc(p.images[0])}" alt="">` : ''}
      ${p.images.length > 1 ? '<button class="nav l" id="gl" aria-label="前の画像">‹</button><button class="nav r" id="gr" aria-label="次の画像">›</button>' : ''}</div>
    ${p.images.length > 1 ? `<div class="thumbs">${p.images.map((u, k) => `<button data-k="${k}" aria-current="${k === 0}"><img src="${esc(u)}" alt=""></button>`).join('')}</div>` : ''}
    <h2>${esc(p.title)}</h2>
    <div class="dmeta">${p.cat ? `<span class="chip">${esc(p.cat)}</span>` : ''}<span>${fmtDate(p.date)}</span></div>
    ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
    <div class="dl">${p.files.map(f => `<a class="file" href="${esc(f.url)}" target="_blank" rel="noopener"><span>⬇ ${esc(f.name)}</span><small>${fmtSize(f.size)}</small></a>`).join('') || '<p class="count">ダウンロードできるファイルはありません</p>'}</div>
    <button class="btn" data-dbm="${esc(p.id)}"></button>
    <a class="src" href="${esc(p.page)}" target="_blank" rel="noopener">GitHub のリリースを開く</a>
  </div>`;
  setDbm($('#mbody [data-dbm]'), p.id);
  const show = k => {
    i = (k + p.images.length) % p.images.length;
    $('#gimg').src = p.images[i];
    document.querySelectorAll('.thumbs button').forEach((t, n) => t.setAttribute('aria-current', n === i));
  };
  $('#gl')?.addEventListener('click', () => show(i - 1));
  $('#gr')?.addEventListener('click', () => show(i + 1));
  document.querySelectorAll('.thumbs button').forEach(t => t.addEventListener('click', () => show(Number(t.dataset.k))));
  $('#mbody [data-dbm]').addEventListener('click', () => toggleBm(p.id));
  $('#modal').hidden = false;
  $('#mclose').focus();
}
function closeModal(){ $('#modal').hidden = true; $('#mbody').innerHTML = ''; }

// ----- イベント -----
$('#tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; S.cat = b.dataset.cat; render(); });
$('#q').addEventListener('input', e => { S.q = e.target.value; renderGrid(); });
$('#sort').addEventListener('change', e => { S.sort = e.target.value; renderGrid(); });
$('#grid').addEventListener('click', e => {
  const bm = e.target.closest('[data-bm]'); if (bm) { e.stopPropagation(); toggleBm(bm.dataset.bm); return; }
  const c = e.target.closest('.card'); if (c) openDetail(c.dataset.id);
});
$('#grid').addEventListener('keydown', e => { const c = e.target.closest('.card'); if (c && e.target === c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDetail(c.dataset.id); } });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#mclose').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

// ----- 起動 -----
(async () => {
  if (DEMO) {
    $('#demoNote').hidden = false;
    if (document.fonts) { try { await document.fonts.ready; } catch {} }
    S.posts = demoPosts();
  } else {
    $('#postLink').href = `https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/releases/new`;
    try { S.posts = await loadReleases(); }
    catch (err) { $('#grid').innerHTML = `<p class="empty">${esc(err.message)}</p>`; return; }
  }
  buildCats(); render();
})();
</script>
</body>
</html>
